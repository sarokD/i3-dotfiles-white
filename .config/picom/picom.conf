corner-radius = 5;

blur-method = "dual_kawase";
blur-strength = 8;

backend = "glx";
dithered-present = false;



animations = (
	{
		triggers = ["open", "show"];
		preset = "slide-in";
		direction = "right";
		duration = 0.1;
	},
	{
		triggers = ["close", "hide"];
		preset = "slide-out";
		direction = "left";
		duration = 0.1;
	}
);
